# Backend CI/CD 파이프라인 (학습용 주석 포함)
#
# 전체 흐름
#   feat/k3s-poc 에 backend 코드 반영
#     → Gradle 테스트 + bootJar
#     → Docker 이미지 빌드 후 GHCR 에 Push (태그 = Git Commit SHA)
#     → infra/environments/local/backend.yaml 의 image tag 를 같은 SHA 로 수정해 같은 브랜치에 Commit
#     → Argo CD 가 그 Commit 을 감지해 k3s 에 배포 (이 워크플로는 배포를 직접 하지 않는다)
#
# 역할 분담
#   GitHub Actions : CI(테스트·빌드·이미지 게시) + Git 의 배포 설정(이미지 태그) 갱신
#   Argo CD        : Git 을 읽기만 한다(Pull). 클러스터에 Git 상태를 반영한다.
#   k3s            : GHCR 에서 이미지를 직접 Pull 해서 Pod 를 실행한다.
name: Backend CI/CD

on:
  push:
    branches:
      - feat/k3s-poc
    # 이 경로가 바뀔 때만 실행한다.
    # environments/local/backend.yaml 은 일부러 넣지 않았다. 봇이 태그를 Commit 해도
    # 워크플로가 다시 돌아 무한 반복되는 것을 막기 위해서다.
    paths:
      - "k3s-poc/backend/**"
      - ".github/workflows/backend-ci-cd.yml"

  # Actions 탭에서 수동 실행. 최초 이미지 게시와 파이프라인 검증에 사용한다.
  workflow_dispatch:

# GITHUB_TOKEN 에 부여할 권한. 저장소 기본값이 read 여도 여기서 명시한 권한이 적용된다.
#   contents: write → 이미지 태그를 바꾼 Commit 을 실행된 브랜치에 Push
#   packages: write → GHCR 에 이미지 Push
permissions:
  contents: write
  packages: write

# 배포 작업이 겹치지 않도록 한 번에 하나만 실행한다.
# 실행 중인 작업을 취소하면 이미지는 올라갔는데 태그 Commit 은 빠지는 상태가 생길 수 있어
# cancel-in-progress 는 false 로 두고 대기열에 쌓는다.
concurrency:
  group: backend-deployment
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 소스 Checkout
      #    ref 를 지정하지 않으면 이벤트가 발생한 바로 그 Commit 을 받는다.
      #    그래서 이미지 태그로 쓰는 github.sha 와 빌드한 소스가 항상 일치한다.
      #    persist-credentials 가 true 여야 마지막 단계에서 git push 가 가능하다.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      # 2. Java 21 설치 (build.gradle.kts 의 toolchain 과 같은 버전)
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # 3. Gradle 환경 구성 및 의존성 캐시
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 4. 테스트 + 실행 JAR 생성
      #    테스트는 H2 인메모리 DB 를 쓰므로 PostgreSQL 서비스 컨테이너가 필요 없다.
      #    Dockerfile 이 build/libs/app.jar 를 복사하므로 이미지 빌드 전에 반드시 먼저 실행한다.
      - name: Build Spring Boot
        working-directory: k3s-poc/backend
        run: |
          chmod +x gradlew
          ./gradlew test bootJar --no-daemon

      # 5. GHCR 로그인. 별도 PAT 없이 Actions 가 발급하는 GITHUB_TOKEN 을 쓴다.
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 6. Docker Buildx 준비
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 7. 이미지 빌드 및 GHCR Push
      #    latest 대신 Commit SHA 태그만 쓴다. 어떤 소스로 만든 이미지인지 추적할 수 있다.
      #    source 라벨은 GHCR 패키지를 이 저장소와 연결하는 데 쓰인다.
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./k3s-poc/backend
          push: true
          tags: ghcr.io/crookedsystem/helloworld-backend:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/crookedsystem/helloworld
            org.opencontainers.image.revision=${{ github.sha }}

      # 8. 배포 설정의 이미지 태그를 방금 올린 SHA 로 교체
      #    7번이 성공해야만 여기까지 오므로, 존재하지 않는 이미지를 가리키는 Commit 은 만들어지지 않는다.
      #    정규식은 "공백 2칸 + 태그 키" 줄(image 블록 안의 태그)만 바꾸고,
      #    일치하는 줄이 정확히 1개가 아니면 파일 구조가 바뀐 것이므로 실패시킨다.
      - name: Update GitOps image tag
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("k3s-poc/infra/environments/local/backend.yaml")
          content = path.read_text()

          pattern = r"(?m)^(\s{2}tag:\s*).+$"
          updated, count = re.subn(
              pattern,
              lambda m: m.group(1) + '"' + os.environ["IMAGE_TAG"] + '"',
              content,
          )

          if count != 1:
              raise RuntimeError(f"Expected one image tag, found {count}")

          path.write_text(updated)
          PY

      # 9. 변경된 배포 설정을 실행된 브랜치(github.ref_name)에 Commit/Push
      #    GITHUB_TOKEN 으로 만든 Commit 은 다른 워크플로를 다시 트리거하지 않는다.
      #    그 사이 브랜치가 앞서 나갔을 수 있어 rebase 후 Push 한다.
      #    브랜치 보호가 생기면 이 Push 가 거부되므로, 그때는 PR 방식으로 바꿔야 한다.
      - name: Commit GitOps update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add k3s-poc/infra/environments/local/backend.yaml

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "chore(gitops): deploy backend ${{ github.sha }}"

          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
