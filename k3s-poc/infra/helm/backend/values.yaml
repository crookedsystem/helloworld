# Spring Boot 복제본 개수
replicaCount: 1

image:
  repository: k3s-demo-backend
  tag: v3
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

database:
  url: jdbc:postgresql://postgres:5432/appdb
  username: app

  # 비밀번호는 기존 Secret 참조
  existingSecret: postgres-auth
  passwordKey: POSTGRES_PASSWORD

probes:
  startup:
    path: /actuator/health/liveness
    periodSeconds: 5
    failureThreshold: 30
    timeoutSeconds: 2

  readiness:
    path: /actuator/health/readiness
    periodSeconds: 5
    failureThreshold: 3
    timeoutSeconds: 2

  liveness:
    path: /actuator/health/liveness
    periodSeconds: 10
    failureThreshold: 3
    timeoutSeconds: 2

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi
