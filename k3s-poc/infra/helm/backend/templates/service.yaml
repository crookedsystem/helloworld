apiVersion: v1
kind: Service

metadata:
  # 기존 Service 이름 유지
  name: backend

  labels:
    app: backend
    app.kubernetes.io/managed-by: {{ .Release.Service }}

spec:
  type: {{ .Values.service.type }}

  # 기존 Pod 라벨과 동일
  selector:
    app: backend

  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
