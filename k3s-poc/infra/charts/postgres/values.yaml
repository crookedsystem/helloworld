replicaCount: 1

image:
  repository: postgres
  tag: "17"
  pullPolicy: IfNotPresent

database:
  name: appdb
  username: app

  existingSecret: postgres-auth
  passwordKey: POSTGRES_PASSWORD

service:
  port: 5432

persistence:
  storageClass: local-path
  accessMode: ReadWriteOnce
  size: 5Gi

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi
