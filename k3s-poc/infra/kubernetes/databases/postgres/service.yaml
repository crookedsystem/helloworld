apiVersion: v1
kind: Service

metadata:
  # backend가 jdbc:postgresql://postgres:5432/appdb로 접근하는 DNS 이름
  name: postgres
  labels:
    app: postgres

spec:
  type: ClusterIP

  # app=postgres 라벨을 가진 Pod로 트래픽 전달
  selector:
    app: postgres

  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP

---
apiVersion: v1
kind: Service

metadata:
  # StatefulSet의 serviceName이 참조하는 Headless Service
  # Pod별 DNS(postgres-0.postgres-headless)를 제공
  name: postgres-headless
  labels:
    app: postgres

spec:
  # clusterIP를 None으로 두면 가상 IP 없이 Pod IP를 DNS로 직접 반환
  clusterIP: None

  selector:
    app: postgres

  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP
