# Kubernetes Core API 그룹
# Service, Pod, ConfigMap, Secret 등에서 사용
apiVersion: v1

# 생성할 리소스 종류
#
# Service는 Pod에 접근하기 위한 안정적인 네트워크 진입점을 제공
#
# Pod의 IP는 재생성될 때 변경될 수 있지만,
# Service의 이름과 ClusterIP는 Service가 유지되는 동안 안정적으로 사용 가능
#
# Service는 Pod 자체를 실행하거나 복구하지 않음
# Pod 생성과 복구는 Deployment/ReplicaSet이 담당
kind: Service

# Service 자체의 메타데이터
metadata:
  # Service 이름
  #
  # 같은 Namespace의 다른 Pod에서는 DNS로 접근 가능
  # http://backend
  #
  # 다른 Namespace에서는 다음 형식 사용
  # http://backend.<namespace>.svc.cluster.local
  #
  # 현재 default Namespace라면:
  # http://backend.default.svc.cluster.local
  name: backend

# Service의 네트워크 설정
spec:
  # Service의 노출 방식
  #
  # ClusterIP:
  #   클러스터 내부에서 접근하는 가상 IP를 할당
  #   기본 Service 타입
  #   외부에 직접 노출되지 않음
  #
  # NodePort:
  #   각 노드의 특정 포트로 Service 접근 가능
  #   일반적으로 30000~32767 범위를 사용
  #
  # LoadBalancer:
  #   외부 로드밸런서 연동을 요청
  #   클라우드에서는 AWS ELB 등의 로드밸런서와 연동 가능
  #   k3s에서는 ServiceLB가 기본 제공됨
  #
  # ExternalName:
  #   외부 DNS 이름에 대한 별칭 역할
  #   일반적인 ClusterIP 기반 Pod 트래픽 전달과 다름
  #
  # 현재는 내부 통신 및 port-forward 실습용 ClusterIP 사용
  type: ClusterIP

  # Service가 트래픽을 전달할 Pod를 선택하는 조건
  #
  # app=backend 라벨을 가진 Pod가 대상
  #
  # Deployment의 다음 설정과 일치해야 함
  #
  # template:
  #   metadata:
  #     labels:
  #       app: backend
  #
  # replicas를 3으로 늘리면 동일 라벨의 Pod 3개가 선택됨
  #
  # Kubernetes는 EndpointSlice를 통해
  # Service에 연결할 Pod의 IP와 포트 정보를 관리
  #
  # readinessProbe가 구성되어 있다면
  # 정상적으로 준비된 Pod만 일반적으로 트래픽 대상이 됨
  selector:
    app: backend

  # Service가 제공할 네트워크 포트 목록
  ports:
    # Service가 클러스터 내부에 노출할 포트
    #
    # 현재 실제 Service:
    # 10.43.244.68:80
    #
    # 다른 Pod에서 http://backend:80으로 호출하면
    # Service가 선택한 backend Pod의 8080으로 전달
    - port: 80

      # Service가 연결할 Pod의 목적지 포트
      #
      # Spring Boot 애플리케이션이 사용하는 8080 포트
      #
      # Service:80 → Pod:8080
      #
      # Pod가 여러 개라면 선택된 백엔드 엔드포인트로 전달
      targetPort: 8080

      # TCP 또는 UDP 등의 프로토콜 지정
      # HTTP는 TCP 위에서 동작하므로 TCP 사용
      protocol: TCP
